<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Products | Amson Pharmaceuticals</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<!-- Custom styles -->
<link rel="icon" type="image/png" href="../assets/logo-transp.png">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="top-bar"></div>

<!-- ===== Header ===== -->
<header class="site-header">
  <div class="container py-2">
    <div class="d-flex align-items-center flex-wrap gap-3 py-2">
      <!-- Logo / Brand -->
      <a href="index.html" class="d-flex align-items-center text-decoration-none flex-shrink-0">
        <img src="../assets/logo.png" alt="Amson Pharmaceuticals" class="brand-logo">
        <span class="brand-name">Amson Pharmaceuticals</span>
      </a>

      <!-- Search -->
      <div class="flex-grow-1 order-3 order-md-2" style="min-width:220px;">
        <div class="input-group">
          <input type="text" class="form-control search-input" placeholder="Search for medicines, vitamins, supplements...">
          <button class="btn search-btn" type="button"><i class="bi bi-search"></i></button>
        </div>
      </div>

      <!-- Cart & Auth actions -->
      <div class="d-flex align-items-center gap-3 order-2 order-md-3 ms-auto">
        <a href="cart.html" class="cart-icon position-relative">
          <i class="bi bi-cart3"></i>
          <span id="cartBadge" class="cart-badge d-none">0</span>
        </a>

        <!-- Guest state -->
        <div id="guestActions" class="d-flex align-items-center gap-3">
          <a href="../login.html" class="btn btn-outline-dark-amson btn-sm px-3">Login</a>
          <a href="../register.html" class="btn btn-amson btn-sm px-3">Register</a>
        </div>

        <!-- Signed-in state -->
        <div id="accountActions" class="d-flex align-items-center gap-3 d-none">
          <div class="dropdown">
            <a href="#" class="bell-icon position-relative" id="notifBellBtn" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-bell"></i>
              <span id="notifBadge" class="cart-badge d-none">0</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end account-dropdown-menu" id="notifDropdownList" style="min-width:280px; max-height:340px; overflow-y:auto;">
              <li class="px-3 py-2 text-muted" id="notifEmptyState">Nothing new right now.</li>
            </ul>
          </div>
          <div class="dropdown">
            <button class="account-btn dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-person-circle"></i>
              <span id="accountFirstName">Account</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end account-dropdown-menu">
              <li id="headerCreditItem" class="d-none"><a class="dropdown-item" href="account-settings.html"><i class="bi bi-wallet2"></i><span id="headerCreditAmount"></span> Credit</a></li>
              <li><a class="dropdown-item" href="orders.html"><i class="bi bi-box-seam"></i>My Orders</a></li>
              <li><a class="dropdown-item" href="account-settings.html"><i class="bi bi-gear"></i>Account Settings</a></li>
              <li><a class="dropdown-item text-danger" href="#" id="logoutLink"><i class="bi bi-box-arrow-right"></i>Logout</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Category nav -->
  <nav class="category-nav">
    <div class="container">
      <ul class="nav flex-nowrap flex-md-wrap justify-content-md-center">
        <li class="nav-item"><a class="nav-link" href="products.html">All Products</a></li>
      </ul>
    </div>
  </nav>
</header>

<!-- ===== Product Catalog ===== -->
<main class="section-block bg-light-gray">
  <div class="container">
    <h1 class="section-title mb-2" id="productsHeading">All Products</h1>
    <p class="text-muted mb-4 d-none" id="searchSummary"></p>

    <div class="row g-4">
      <!-- Filter sidebar -->
      <div class="col-lg-3">
        <div class="filter-panel">
          <h6><i class="bi bi-funnel"></i> Filter</h6>

          <label class="form-label">Category</label>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="catAll" value="all" checked>
            <label class="form-check-label" for="catAll">All Products</label>
          </div>
          <div id="categoryFilterList"></div>

          <label class="form-label mt-3">Price Range (&#8369;)</label>
          <div class="d-flex gap-2 align-items-center">
            <input type="number" min="0" step="1" class="form-control form-control-sm" id="priceMinInput" placeholder="Min" aria-label="Minimum price">
            <span class="text-muted">-</span>
            <input type="number" min="0" step="1" class="form-control form-control-sm" id="priceMaxInput" placeholder="Max" aria-label="Maximum price">
          </div>

          <label for="stockFilterSelect" class="form-label mt-3">Availability</label>
          <select class="form-select" id="stockFilterSelect">
            <option value="all">All products</option>
            <option value="in">In stock only</option>
            <option value="out">Out of stock</option>
          </select>

          <label for="sortBy" class="form-label mt-3">Sort By</label>
          <select class="form-select mb-3" id="sortBy">
            <option value="name-asc">Name (A-Z)</option>
            <option value="name-desc">Name (Z-A)</option>
            <option value="price-asc">Price (Low-High)</option>
            <option value="price-desc">Price (High-Low)</option>
          </select>

          <button type="button" class="btn btn-amson w-100" id="applyFiltersBtn">Search</button>
        </div>
      </div>

      <!-- Product grid -->
      <div class="col-lg-9">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4" id="productsGrid"></div>
        <div class="catalog-pagination" id="pagination"></div>
        <p class="pagination-summary" id="paginationSummary"></p>
      </div>
    </div>
  </div>
</main>

<!-- ===== Footer ===== -->
<footer class="site-footer pt-5"></footer>

<a href="#" class="floating-chat-btn d-none" data-chat-entry><i class="bi bi-chat-square-text-fill"></i>Chat with us</a>

<!-- Product quick-view popup (instead of a full page navigation) -->
<div class="modal fade" id="productQuickViewModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header border-0 pb-0">
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body pt-0" id="productQuickViewBody"></div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Firebase (compat SDK) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- App scripts -->
<script src="../js/firebase-config.js"></script>
<script src="../js/products-data.js"></script>
<script src="../js/device-trust.js"></script>
<script src="../js/shop-header.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/products.js"></script>
<script src="../js/store-info.js"></script>
<script src="../js/chat-config.js"></script>
<script src="../js/live-chat.js"></script>
</body>
</html>
